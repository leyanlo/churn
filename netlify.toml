[build]
command = "pnpm build"
publish = "out"

[build.environment]
NODE_VERSION = "24.22.1"

[[redirects]]
from = "https://milkdrop.leyanlo.com/*"
to = "https://churn.leyanlo.com/:splat"
status = 301
force = true

[[headers]]
for = "/opengraph-image"

  [headers.values]
  Content-Type = "image/png"

[[headers]]
for = "/_next/static/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
